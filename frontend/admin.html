<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Cumpleaños Andrea</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #ffffff; font-family: 'Montserrat', sans-serif; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-family: 'Cinzel', serif; color: #d4af37; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
        #loginBox { background: #141414; border: 1px solid #d4af37; padding: 45px 30px; max-width: 400px; margin: 50px auto 0; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 14px; margin: 12px 0; box-sizing: border-box; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 0.95rem; }
        input { background: #1f1f1f; border: 1px solid #333; color: white; }
        input:focus { border-color: #d4af37; outline: none; }
        button { background: linear-gradient(135deg, #d4af37 0%, #aa831b 100%); border: none; font-weight: 600; cursor: pointer; color: black; text-transform: uppercase; letter-spacing: 1px; }
        #dashboard { display: none; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .metric-card { background: #141414; border-top: 3px solid #d4af37; padding: 25px 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .metric-card h3 { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1.5px; }
        .metric-card p { font-size: 2.8rem; color: #fff; font-weight: bold; margin-top: 10px; font-family: 'Cinzel', serif; }
        .metric-card.destacado p { color: #d4af37; }
        .table-container { overflow-x: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; background: #141414; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #222; font-size: 0.9rem; }
        th { background-color: #1a1a1a; color: #d4af37; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        tr:hover { background-color: #1c1c1c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dashboard de Control</h1>

        <div id="loginBox">
            <h3 style="color:#fff; margin-bottom:15px; font-weight: 400; font-size: 1.1rem;">Administración de Lista</h3>
            <input type="password" id="adminPass" placeholder="Contraseña del Panel">
            <button onclick="cargarDashboard()">Ingresar</button>
        </div>

        <div id="dashboard">
            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>Confirmaciones Recibidas</h3>
                    <p id="mFormularios">0</p>
                </div>
                <div class="metric-card destacado">
                    <h3>Asistentes Totales Reales</h3>
                    <p id="mTotalPersonas">0</p>
                </div>
                <div class="metric-card">
                    <h3>Consumo de Alcohol</h3>
                    <p id="mAlcohol">0</p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre del Invitado</th>
                            <th>Acompañantes</th>
                            <th>¿Toma Alcohol?</th>
                            <th>Restricciones Alimentarias</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
           const API_URL = "https://onrender.com";

        async function cargarDashboard() {
            const password = document.getElementById("adminPass").value;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                const data = await res.json();

                if (!data.success) {
                    alert(data.error || "Acceso Denegado");
                    return;
                }

                document.getElementById("loginBox").style.display = "none";
                document.getElementById("dashboard").style.display = "block";

                procesarYRenderizar(data.invitados);

            } catch (error) {
                alert("No se pudo conectar con el servidor Backend.");
            }
        }

        function procesarYRenderizar(invitados) {
            const tabla = document.getElementById("tablaCuerpo");
            tabla.innerHTML = "";

            let totalFormularios = invitados.length;
            let totalAsistentesReales = 0;
            let totalAlcohol = 0;

            invitados.forEach(inv => {
                let cantidadPersonasPorRegistro = 1;
                
                if (inv.acompanante === "1 Acompañante") {
                    cantidadPersonasPorRegistro = 2;
                } else if (inv.acompanante === "2 Acompañantes") {
                    cantidadPersonasPorRegistro = 3;
                }

                totalAsistentesReales += cantidadPersonasPorRegistro;

                if (inv.tomaAlcohol === 'Sí') {
                    totalAlcohol += cantidadPersonasPorRegistro;
                }

                const fila = `
                    <tr>
                        <td style="font-weight:600; color: #fff;">${inv.nombre}</td>
                        <td>${inv.acompanante}</td>
                        <td>${inv.tomaAlcohol}</td>
                        <td style="color: ${inv.problemasComida !== 'Ninguna' ? '#d4af37' : '#888'}">${inv.problemasComida}</td>
                    </tr>
                `;
                tabla.innerHTML += fila;
            });

            document.getElementById("mFormularios").innerText = totalFormularios;
            document.getElementById("mTotalPersonas").innerText = totalAsistentesReales;
            document.getElementById("mAlcohol").innerText = totalAlcohol;
        }
    </script>
</body>
</html>
